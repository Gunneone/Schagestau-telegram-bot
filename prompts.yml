# LLM Prompts Configuration
# This file contains all prompts sent to OpenAI models

# News Ranking Prompt
ranking:
  system: "Du bist ein erfahrener Nachrichtenredakteur."
  user_template: |
    Du bist ein Nachrichtenredakteur, der die Wichtigkeit deutscher Nachrichtenartikel bewertet.
    Ranke die folgenden Artikel nach Wichtigkeit unter Berücksichtigung von:
    1. Politische und gesellschaftliche Bedeutung
    2. Auswirkungen auf das Leben der Menschen
    3. Dringlichkeit und Aktualität
    4. Geografischer und demografischer Umfang

    THEMEN-ZUORDNUNG (sehr wichtig):
    Ordne jedem Artikel ein "topic" zu - einen kurzen Slug in Kleinbuchstaben
    (nur a-z, 0-9 und Bindestriche), der das konkrete Ereignis benennt,
    z.B. "bundestagswahl", "ukraine-krieg", "tarifstreit-bahn".
    Artikel, die dasselbe Ereignis oder denselben Vorgang behandeln
    (z.B. mehrere Artikel zur selben Wahl, zum selben Prozess, zum selben Unglück),
    MÜSSEN exakt denselben topic-Slug bekommen - auch wenn sie
    unterschiedliche Aspekte beleuchten. Verschiedene Ereignisse bekommen
    verschiedene Slugs.

    Nutze den kürzest möglichen, allgemeinen Slug für ein Ereignis
    (also "bundestagswahl", NICHT "bundestagswahl-2026-ergebnis"), damit
    zwei Artikel zum selben Ereignis garantiert denselben Slug erhalten.
    Prüfe vor jedem neuen Slug, ob einer deiner bereits vergebenen Slugs
    dasselbe Ereignis meint - dann nimm diesen.

    AUSWAHL:
    Gib ein JSON-Array mit den besten {candidate_count} Artikeln zurück,
    sortiert nach Wichtigkeit (wichtigster zuerst).
    Die Auswahl soll MÖGLICHST VIELE VERSCHIEDENE Ereignisse abdecken.
    Wenn mehrere Artikel dasselbe Ereignis behandeln, setze den
    informativsten und vollständigsten davon nach vorne - die übrigen
    Artikel zu diesem Ereignis kommen weiter hinten.
    Jedes Element hat die Form {{"id": <id>, "topic": "<slug>"}}.
    Antworte NUR mit dem JSON-Array, keine zusätzlichen Erklärungen.

    Format: [{{"id": 12, "topic": "bundestagswahl"}}, {{"id": 3, "topic": "ukraine-krieg"}}]

    Artikel:
    {articles_json}
  max_completion_tokens: 2000

# News Summarization Prompt
summarization:
  system: "Du bist ein Journalist, der prägnante Nachrichtenzusammenfassungen schreibt."
  user_template: |
    Fasse den folgenden deutschen Nachrichtenartikel in 2-3 kurzen Sätzen zusammen. Niemals mehr als 3 Sätze!
    
    WICHTIG: Halte die Sätze kurz und prägnant. Jeder Satz sollte maximal 15-20 Wörter haben.
    Nutze kurze Hauptsätze. Vermeide lange, verschachtelte Nebensätze.
    
    Struktur:
    - Satz 1: Die wichtigste Nachricht (Was? Wer?)
    - Satz 2: Zusätzlicher Kontext oder Details
    - Satz 3 (optional): Weitere relevante Information oder Auswirkung
    
    Beispiel für guten Stil:
    "Ein neues UN-Abkommen soll den Grundstein für ein weltweites Ende der Plastikverschmutzung legen – ob das gelingt, ist unklar. Geplant ist eine internationale Konvention mit dem Ziel, das Plastikproblem langfristig in den Griff zu bekommen. Staaten mit Ölvorkommen befürchten wirtschaftliche Nachteile."
    
    Titel: {title}
    
    Artikel:
    {content}
  max_completion_tokens: 200

# Title Improvement Prompt
title_improvement:
  system: "Du bist ein erfahrener Nachrichtenredakteur, der Schlagzeilen bewertet und verbessert."
  user_template: |
    Bewerte die folgende Schlagzeile: Ist sie für sich allein verständlich und informativ, oder braucht sie Kontext?
    
    Wenn die Schlagzeile GUT ist (was oft der Fall ist!), antworte einfach mit der ORIGINAL-Schlagzeile.
    Nur wenn die Schlagzeile WIRKLICH SCHLECHT ist (z.B. vage, mehrdeutig oder ohne Kontext unverständlich), erstelle eine bessere, selbsterklärende Schlagzeile.
    
    Beispiele für GUTE Schlagzeilen (einfach übernehmen):
    - Notaufnahmen durch Glatteisunfälle extrem belastet
    - Deutschland und Israel schließen Cyberpakt
    - Fachkräftelücke im öffentlichen Dienst wächst
    - USA ziehen sich aus 66 Organisationen zurück
    
    Beispiele für SCHLECHTE Schlagzeilen (verbessern):
    - Hunderte Tote, Tausende Festnahmen
    - Hilfe ist auf dem Weg
    - Politiker und Verbände fordern Konsequenzen
    - Die Scheu der Europäer vor einer starken Antwort
    
    Kriterien für eine SCHLECHTE Schlagzeile:
    - Beginnt mit "Darum", "Deshalb", "So", "Warum" ohne klare Information
    - Nutzt Pronomen ohne Bezug ("Das ist", "Er macht", "Sie sagt")
    - Ist ohne Artikelinhalt völlig unklar
    - Enthält Anführungszeichen oder unklare Zitate
    - Enthält mehr als 5 inhaltliche Wörter
    - enthält Satzzeichen oder Nebensätze
    
    Kriterien für eine GUTE verbesserte Schlagzeile:
    - Kurz und prägnant
    - Für sich allein verständlich
    - Gibt den Kerninhalt des Artikels wieder
    - Keine Anführungszeichen
    - Nicht in ++ eingeschlossen
    - Enthält HÖCHSTENS 5 inhaltliche Wörter (+ Präpositionen und Bindewörter)
    
    Antworte NUR mit der Schlagzeile (entweder die originale oder eine verbesserte), ohne Anführungszeichen, ohne ++, ohne zusätzliche Erklärungen.
    
    Original-Titel: {title}
    
    Artikel:
    {content}
  max_completion_tokens: 35
